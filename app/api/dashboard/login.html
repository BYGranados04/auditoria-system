<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101214">
  <title>Iniciar sesión | Auditoria System</title>
  <link rel="stylesheet" href="/dashboard/assets/styles.css">
  <script src="/dashboard/assets/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-panel">
    <h1>Auditoria System</h1>
    <form id="login-form" action="/auth/login" method="post">
      <label>Usuario<input name="username" type="text" autocomplete="username" maxlength="64" required autofocus></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
      <div id="login-error" class="login-error" role="alert" hidden></div>
      <button id="login-button" type="submit">Iniciar sesión</button>
    </form>
  </main>
</body>
</html>
