[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditoria-system"
version = "0.7.0"
description = "Linux security auditing, monitoring and response platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1.0",
    "psutil>=7.2,<8.0",
    "pydantic>=2.13,<3.0",
    "uvicorn[standard]>=0.53,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.13,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.api" = ["dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
